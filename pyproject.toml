[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-orchestrator"
version = "0.1.0"
description = "AI-powered development orchestrator using multiple LLM agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Lucas Donnangelo"},
]

dependencies = [
    "anthropic>=0.87.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "rich>=13.0",
    "typer[all]",
    "pydantic",
    "claude-agent-sdk>=0.1.50",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
orchestrate = "orchestrator.cli:cli"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
