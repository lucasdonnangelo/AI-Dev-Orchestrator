# =============================================================================
# AI Dev Orchestrator — Default Configuration
# =============================================================================
# Override per-project by placing a .orchestrator.yaml in the project root.

# --- Anthropic ---
# Model used by the Planner and (if planner_provider=anthropic) Reviewer
model: "claude-sonnet-4-6"

# --- Google (Gemini) ---
# google_api_key is read from GOOGLE_API_KEY env var; set here only for
# project-level overrides (not recommended — use .env instead)
google_model: "gemini-2.5-flash"

# --- OpenAI ---
# openai_api_key is read from OPENAI_API_KEY env var
openai_model: "gpt-4o-mini"

# --- Provider assignment per role ---
# Valid values: anthropic | google | openai
planner_provider: "anthropic"
critic_provider: "google"
reviewer_provider: "google"
decisor_provider: "google"

# --- Execution ---
# Maximum correction loop iterations before escalating to the user
max_retries: 3

# Tools the Executor agent is allowed to use
executor_allowed_tools:
  - Read
  - Edit
  - Write
  - Bash
  - Glob
  - Grep

# Whether to ask user confirmation before executing the plan
confirm_plan: true

# Whether to ask user confirmation before committing
confirm_commit: true

# Logging
log_dir: "logs"
log_level: "INFO"
